<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#123548" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      html,body{margin:0;background:#102b32;color:#e6eee8;font-family:Arial,sans-serif}#world{position:fixed;inset:0;width:100%;height:100%}#app{position:relative;z-index:2}
      .boot-shell{height:100dvh;box-sizing:border-box;padding:16px 20px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 50% 60%,#34565c,#102b32 75%)}.boot-shell header{font-family:Georgia,serif;color:#e4cf9c;letter-spacing:2px}.boot-shell header small{display:block;font:9px Arial,sans-serif;letter-spacing:2px;margin-top:6px}.boot-stage{align-self:center;text-align:center;color:#9bd4be;font-size:13px}.boot-stage span{display:block;font:44px Georgia,serif;color:#c8a25a;margin-bottom:12px}.boot-shell footer{align-self:flex-end}.boot-shell button{background:linear-gradient(#fbbf24,#d97706);color:#0f172a;border:1px solid #fef08a;padding:15px 28px;font-weight:bold}.boot-shell button:disabled{opacity:.65}
    </style>
    <title>Hồn Giới: Sinh Tồn</title>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="app"><main class="boot-shell" aria-label="Hồn Thành đang khởi động"><header>HỒN GIỚI<small>SINH TỒN · THƯƠNG MANG CỔ VỰC</small></header><div class="boot-stage" role="status"><span>魂</span>Đang mở Hồn Thành…</div><footer><button disabled>ĐANG CHUẨN BỊ…</button></footer></main></div>
    <div id="toast" role="status"></div>
    <div id="rotate">
      <span>⟳</span>
      <h2>XOAY NGANG ĐỂ KHAI MỞ HỒN GIỚI</h2>
      <p>Trải nghiệm được thiết kế cho màn hình ngang.</p>
      <button id="rotatePlay">Tiếp tục</button>
    </div>
    <script>
      window.__HON_GIOI_BOOT__={started:performance.now(),longTasks:[],marks:{shellDOM:performance.now()}};
      requestAnimationFrame(function(){window.__HON_GIOI_BOOT__.marks.shellFrame=performance.now();});
    </script>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
