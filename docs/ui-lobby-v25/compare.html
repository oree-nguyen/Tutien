<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Đối chiếu UI Hồn Thành</title><style>body{margin:20px;background:#10272d;color:#f1e5ba;font:16px system-ui}select,input{font:inherit}#stage{position:relative;max-width:1376px;aspect-ratio:1376/768;border:1px solid #cab37e;margin-top:15px}img{position:absolute;width:100%;height:100%;object-fit:contain}#actual{clip-path:inset(0 50% 0 0)}input{width:min(600px,90vw)}p{max-width:900px;line-height:1.5}</style><h1>Ảnh mẫu và game thực tế</h1><p>Chưa đạt giống 100%. Kéo thanh để đối chiếu. Trái là game, phải là mẫu. Số dư, rank, trợ phẩm dùng dữ liệu thật; các dịch vụ chưa có máy chủ được ghi rõ chưa mở.</p><label>Màn <select id="screen"></select></label> <label>Độ phủ game <input id="split" type="range" min="0" max="100" value="50"></label><div id="stage"><img id="ref" alt="Ảnh mẫu"><img id="actual" alt="Ảnh game thực tế"></div><script>const names=['home','character','heroes','friends','profile','pass','quests'];const screenSelect=document.querySelector('#screen');names.forEach((n,i)=>screenSelect.add(new Option('H'+(i+1)+' '+n,i)));function show(){const i=+screenSelect.value;document.querySelector('#ref').src='../requests/lobby-ui-v25/reference/image'+(i+2)+'.jpeg';document.querySelector('#actual').src='H'+(i+1)+'-'+names[i]+'-1376x768.png'}screenSelect.onchange=show;document.querySelector('#split').oninput=e=>document.querySelector('#actual').style.clipPath=`inset(0 ${100-e.target.value}% 0 0)`;show()</script></html>
